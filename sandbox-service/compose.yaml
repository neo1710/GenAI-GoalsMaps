services:
  sandbox-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandbox-agent-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - SANDBOX_EXECUTION_TIMEOUT=30
      - ENABLE_SECURITY_CHECK=true
    volumes:
      - ./workspace/input:/workspace/input
      - ./workspace/output:/workspace/output
    restart: unless-stopped

